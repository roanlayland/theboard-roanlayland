name: Refresh from Google Sheets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node prerender.mjs
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "refresh pages" && git push)
